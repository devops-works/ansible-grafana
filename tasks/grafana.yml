---
- name: Installs apt-transport-https
  ansible.builtin.apt:
    pkg: apt-transport-https
    state: present

- name: Ensures keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Imports grafana apt key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: Adds grafana repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    state: present
    update_cache: true

- name: Installs grafana
  ansible.builtin.apt:
    pkg: grafana
    state: present

- name: Configures grafana
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: "0640"
    backup: true
  notify: ['Restart grafana']

- name: Ensure grafana starts at boot
  ansible.builtin.service:
    name: grafana-server
    enabled: true
